name: Security Scan Automation

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main ]
  workflow_dispatch: 

jobs:
  scanner:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip' # Optional: speeds up future runs

      - name: Install dependencies
        run: |
          # Move to the server directory where requirements.txt is
          cd server
          pip install -r requirements.txt
          # Also install PyGithub explicitly if it's not in your requirements.txt
          pip install PyGithub pydantic python-dotenv

      - name: Run Security Scan Script
        env:
          # Make sure this secret name matches what you saved in GitHub Settings
          GITHUB_TOKEN: ${{ secrets.SCANNER_GITHUB_TOKEN }}
        run: |
          # Use the correct path to your script
          python server/app/cli_scanner.py --user "krishnabhargavb-metron" --limit 3