name: Security Scan Automation

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main ]
  workflow_dispatch: 

jobs:
  scanner:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip' # Optional: speeds up future runs

      - name: Install dependencies
        run: |
          # Move to the server directory where requirements.txt is
          cd server
          pip install -r requirements.txt
          # Also install PyGithub explicitly if it's not in your requirements.txt
          pip install PyGithub pydantic python-dotenv pytest

      - name: Run Sanitizer Tests
        working-directory: server
        run: |
          pytest app/utils/test_sanitizer.py -v

      - name: Run Security Scan Script
        env:
          # Make sure this secret name matches what you saved in GitHub Settings
          GITHUB_TOKEN: ${{ secrets.SCANNER_GITHUB_TOKEN }}
          PYTHONPATH: ${{ github.workspace }}/server
        run: |
          # Use the correct path to your script
          cd server
          python -m app.cli_scanner --user "krishnabhargavb-metron" --limit 3